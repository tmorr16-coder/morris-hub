name: Security review
on:
  schedule:
    - cron: '2-57/5 * * * *'
      timezone: America/Indiana/Indianapolis
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-review
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    outputs:
      should_run: ${{ steps.queue.outputs.should_run }}
      repair: ${{ steps.queue.outputs.repair }}
      targets: ${{ steps.queue.outputs.targets }}
      merges: ${{ steps.queue.outputs.merges }}
      sync_pulls: ${{ steps.queue.outputs.sync_pulls }}
      pull_numbers: ${{ steps.queue.outputs.pull_numbers }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: queue
        with:
          script: |
            for (let attempt = 0; attempt < 8; attempt++) {
              const token = await core.getIDToken('https://morrisai.family/api/security/reports');
              const response = await fetch('https://morrisai.family/api/security/queue', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(30000), redirect: 'error' });
              if (response.ok && response.headers.get('content-type')?.includes('application/json')) {
                const decision = await response.json();
                core.setOutput('should_run', decision.should_run === true ? 'true' : 'false');
                core.setOutput('repair', decision.repair === true ? 'true' : 'false');
                core.setOutput('targets', JSON.stringify(decision.targets ?? []));
                core.setOutput('merges', JSON.stringify(decision.merges ?? []));
                core.setOutput('sync_pulls', decision.sync_pulls !== false ? 'true' : 'false');
                core.setOutput('pull_numbers', JSON.stringify(decision.pull_numbers ?? []));
                return;
              }
              if (response.status === 401 || attempt === 7) throw new Error(`Security queue: HTTP ${response.status}`);
              await new Promise(resolve => setTimeout(resolve, 20000));
            }
  review:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    outputs:
      codeql: ${{ steps.analyze.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: mkdir -p security-output
      - name: Audit dependency lockfile
        run: npm audit --json > security-output/audit.json || true
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        id: analyze
        with:
          output: security-output/sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-review-input
          path: security-output
          retention-days: 14
  fix:
    needs: [gate, review]
    if: always() && needs.gate.outputs.should_run == 'true' && needs.review.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      url: ${{ steps.pr.outputs.pull-request-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Apply compatible dependency fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts --json > /tmp/audit-fix.json || true
          node -e "const r=require('/tmp/audit-fix.json'); if(r.error) throw Error('npm remediation failed')"
      - name: Detect lockfile changes
        id: changed
        run: |
          if ! git diff --quiet -- package-lock.json; then echo 'yes=true' >> "$GITHUB_OUTPUT"; fi
      - name: Install candidate without lifecycle scripts
        if: steps.changed.outputs.yes == 'true'
        run: npm ci --ignore-scripts
      - name: Validate candidate
        if: steps.changed.outputs.yes == 'true'
        run: |
          npm run test:security
          npm run test:voice
          npm run test:workout
          npm run test:simplefin
          npm run build
      - name: Confirm tested patch changes only the lockfile
        if: steps.changed.outputs.yes == 'true'
        run: |
          node -e "const cp=require('node:child_process');const paths=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);if(paths.length!==1||paths[0]!=='package-lock.json')throw Error('Candidate exceeds lockfile-only scope')"
      - name: Open or update validated fix PR
        if: steps.changed.outputs.yes == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        id: pr
        with:
          token: ${{ github.token }}
          branch: security/compatible-dependency-fixes
          add-paths: package-lock.json
          commit-message: 'fix(security): apply compatible dependency remediation'
          title: 'Security: validated compatible dependency fixes'
          body: |
            Daily security review generated compatible npm lockfile fixes without force upgrades or install scripts.
            Security, voice, workout and bank-sync tests and the production build passed before this PR was opened.
            Compatible lockfile-only fixes are automatically merged if main and the validated candidate are unchanged and repository policy permits it.
            Findings remain open until a follow-up main-branch review confirms resolution.
          delete-branch: true
      - name: Merge validated lockfile fix and schedule verification
        if: steps.pr.outputs.pull-request-number != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FIX_PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          FIX_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        with:
          script: |
            const merge = require('./scripts/security-merge.cjs');
            await merge({ github, context, core }, process.env.FIX_PR_NUMBER, process.env.FIX_HEAD_SHA);
  repairs:
    needs: [gate, review]
    if: needs.gate.outputs.repair == 'true' && needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    outputs:
      candidates: ${{ steps.agent.outputs.candidates }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generate scoped code fix PRs
        id: agent
        run: node scripts/security-agent.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPAIR_TARGETS: ${{ needs.gate.outputs.targets }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-repairs
          path: repair-results.json
          retention-days: 30
  repair_validation:
    needs: repairs
    if: needs.repairs.result == 'success' && needs.repairs.outputs.candidates != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.repairs.outputs.candidates || '[]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.candidate.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Validate generated candidate without application secrets
        run: |
          npm run test:security
          npm run test:voice
          npm run test:workout
          npm run test:simplefin
          npm run build
  pulls_sync:
    needs: gate
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.sync_pulls == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/security-prs.mjs sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBERS: ${{ needs.gate.outputs.pull_numbers }}
  merge_prepare:
    needs: gate
    if: needs.gate.outputs.merges != '[]' && needs.gate.outputs.merges != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    outputs:
      plans: ${{ steps.prepare.outputs.plans }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - id: prepare
        run: node scripts/security-prs.mjs prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COMMANDS: ${{ needs.gate.outputs.merges }}
  merge_validation:
    needs: merge_prepare
    if: needs.merge_prepare.result == 'success' && needs.merge_prepare.outputs.plans != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plan: ${{ fromJSON(needs.merge_prepare.outputs.plans || '[]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.plan.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Check the reviewed PR against its exact main merge preview
        run: |
          npm run test:security
          npm run test:voice
          npm run test:workout
          npm run test:simplefin
          npm run build
  merge_apply:
    needs: [merge_prepare, merge_validation]
    if: always() && needs.merge_prepare.result == 'success' && needs.merge_prepare.outputs.plans != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/security-prs.mjs merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_PLANS: ${{ needs.merge_prepare.outputs.plans }}
          MERGE_VALIDATION: ${{ needs.merge_validation.result }}
  report:
    needs: [gate, review, fix, repairs, repair_validation]
    if: always() && needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: security-review-input
          path: security-output
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.gate.outputs.repair == 'true'
        continue-on-error: true
        with:
          name: security-repairs
          path: security-output/repair
      - run: mkdir -p security-output
      - name: Assemble coverage and findings
        run: node scripts/security-report.mjs collect
        env:
          CODEQL_RESULT: ${{ needs.review.outputs.codeql }}
          FIX_RESULT: ${{ needs.fix.result }}
          FIX_URL: ${{ needs.fix.outputs.url }}
          REPAIR_REQUESTED: ${{ needs.gate.outputs.repair }}
          REPAIR_RESULT: ${{ needs.repairs.result }}
          REPAIR_VALIDATION_RESULT: ${{ needs.repair_validation.result }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-review-report
          path: security-output/report.json
          retention-days: 30
      - name: Deliver authenticated report and send security alerts
        run: node scripts/security-report.mjs deliver
