name: Security review
on:
  schedule:
    - cron: '17 7 * * *'
      timezone: America/Indiana/Indianapolis
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    outputs:
      codeql: ${{ steps.analyze.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p security-output
      - name: Audit dependency lockfile
        run: npm audit --json > security-output/audit.json || true
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        id: analyze
        with:
          output: security-output/sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-review-input
          path: security-output
          retention-days: 14
  fix:
    needs: review
    if: always() && needs.review.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      url: ${{ steps.pr.outputs.pull-request-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compatible dependency fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts --json > /tmp/audit-fix.json || true
          node -e "const r=require('/tmp/audit-fix.json'); if(r.error) throw Error('npm remediation failed')"
      - name: Detect lockfile changes
        id: changed
        run: |
          if ! git diff --quiet -- package-lock.json; then echo 'yes=true' >> "$GITHUB_OUTPUT"; fi
      - name: Install candidate without lifecycle scripts
        if: steps.changed.outputs.yes == 'true'
        run: npm ci --ignore-scripts
      - name: Validate candidate
        if: steps.changed.outputs.yes == 'true'
        run: |
          npm run test:security
          npm run test:voice
          npm run test:workout
          npm run build
      - name: Confirm tested patch changes only the lockfile
        if: steps.changed.outputs.yes == 'true'
        run: |
          node -e "const cp=require('node:child_process');const paths=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);if(paths.length!==1||paths[0]!=='package-lock.json')throw Error('Candidate exceeds lockfile-only scope')"
      - name: Open or update validated fix PR
        if: steps.changed.outputs.yes == 'true'
        uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          token: ${{ github.token }}
          branch: security/compatible-dependency-fixes
          add-paths: package-lock.json
          commit-message: 'fix(security): apply compatible dependency remediation'
          title: 'Security: validated compatible dependency fixes'
          body: |
            Daily security review generated compatible npm lockfile fixes without force upgrades or install scripts.
            Security, voice and workout tests and the production build passed before this PR was opened.
            Compatible lockfile-only fixes are automatically merged if main and the validated candidate are unchanged and repository policy permits it.
            Findings remain open until a follow-up main-branch review confirms resolution.
          delete-branch: true
      - name: Merge validated lockfile fix and schedule verification
        if: steps.pr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        env:
          FIX_PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          FIX_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        with:
          script: |
            const merge = require('./scripts/security-merge.cjs');
            await merge({ github, context, core }, process.env.FIX_PR_NUMBER, process.env.FIX_HEAD_SHA);
  report:
    needs: [review, fix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: security-review-input
          path: security-output
      - run: mkdir -p security-output
      - name: Assemble coverage and findings
        run: node scripts/security-report.mjs collect
        env:
          CODEQL_RESULT: ${{ needs.review.outputs.codeql }}
          FIX_RESULT: ${{ needs.fix.result }}
          FIX_URL: ${{ needs.fix.outputs.url }}
      - uses: actions/upload-artifact@v4
        with:
          name: security-review-report
          path: security-output/report.json
          retention-days: 30
      - name: Deliver authenticated report and send security alerts
        run: node scripts/security-report.mjs deliver
