version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: America/Indiana/Indianapolis
    open-pull-requests-limit: 5
    groups:
      compatible-security-updates:
        applies-to: security-updates
        update-types: [patch, minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Indiana/Indianapolis
