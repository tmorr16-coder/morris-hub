# XcodeGen spec, kept as an alternative. The committed MorrisHealthSync.xcodeproj
# is written by generate-project.rb, so nothing here needs running to build.
name: MorrisHealthSync
options:
  bundleIdPrefix: family.morrisai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  MorrisHealthSync:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.morrisai.healthsync
        PRODUCT_NAME: MorrisHealthSync
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/MorrisHealthSync.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
